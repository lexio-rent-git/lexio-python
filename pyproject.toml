[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lexio-rent"
version = "0.1.0"
description = "Client Python de l'API Lexio Rent : flotte, locations, devis, clients, paiements et entretien pour les loueurs de véhicules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Lexio Rent", email = "contact@lexio.rent" }]
keywords = ["lexio", "lexio-rent", "car-rental", "location-voiture", "fleet-management", "gestion-de-flotte", "api-client", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://lexio.rent/logiciel-location-voiture"
Documentation = "https://docs.lexio.rent"
"API reference (OpenAPI)" = "https://docs.lexio.rent/openapi.json"
Source = "https://github.com/lexio-rent-git/lexio-python"
Issues = "https://github.com/lexio-rent-git/lexio-python/issues"
Changelog = "https://github.com/lexio-rent-git/lexio-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lexio_rent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "spec", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
